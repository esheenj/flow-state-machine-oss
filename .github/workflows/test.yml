name: Verify workflow examples
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm test
      - run: npm run demo
      - run: npm run replay
      - run: npm run record

  browser-playground:
    name: Real Chrome interactive playground QA
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Show actual browser and Python versions
        run: |
          python3 --version
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Stage exact minimal public Pages artifact
        run: node scripts/stage_pages.mjs dist/pages
      - name: Exercise staged public site through real WebDriver
        run: FLOW_PLAYGROUND_ROOT=dist/pages python3 tests/browser_playground.py
